version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  enable:
    - goconst
    - misspell
    - unconvert
    - unparam
  settings:
    goconst:
      ignore-string-values:
        - ^(server|common_name|unknown)$
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: Error return value of .*log\.Logger\)\.Log\x60 is not checked
      - path: _test\.go$
        linters:
          - goconst
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/patrickjahns/openvpn_exporter/pkg
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
